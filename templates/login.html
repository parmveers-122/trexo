{% extends "base.html" %}
{% block title %}Sign in - Trexo Clinic Trial Booking{% endblock %}
{% block content %}

<div class="login-card">
  <h1>Sign in</h1>
  <p class="subtle">Use your @{{ domain }} Google account to continue.</p>
  {% if error %}
    <p class="search-error">{{ error }}</p>
  {% endif %}
  <a href="{{ url_for('login_google', next=next) }}" class="btn-primary login-btn">Sign in with Google</a>
</div>

{% endblock %}
