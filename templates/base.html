<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinic Trial Requests{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('clinic_directory') }}" class="brand">Trexo Clinic Trial Requests</a>
    <nav class="topnav">
      <a href="{{ url_for('clinic_directory') }}">Clinics</a>
      <a href="{{ url_for('trials_log') }}">Requested Trials</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
